apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebattle
spec:
  replicas: 3

  selector:
    matchLabels:
      app: kubebattle

  template:
    metadata:
      labels:
        app: kubebattle

    spec:
      containers:
        - name: kubebattle
          image: kubebattle:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
